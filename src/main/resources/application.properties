spring.application.name=PayamaX
# Browser calls are limited to PAX_ADMIN_URL. The variable is required.
# A blank value is rejected at startup.
cors.allowed-origins[0]=${PAX_ADMIN_URL}
cors.allowed-methods[0]=GET
cors.allowed-methods[1]=HEAD
cors.allowed-methods[2]=POST
cors.allowed-methods[3]=PUT
cors.allowed-methods[4]=PATCH
cors.allowed-methods[5]=DELETE
cors.allowed-methods[6]=OPTIONS
# * accepts the headers named on the preflight, including Authorization.
cors.allowed-headers[0]=*
# How long a browser may cache the preflight response.
cors.max-age=3600s
# Bearer tokens do not need cookies on cross-origin calls.
cors.allow-credentials=false
# Honor X-Forwarded-* from the reverse proxy so generated URLs, including Swagger, use https.
server.forward-headers-strategy=framework
oauth2.realm=pax
oauth2.client-id=SwaggerUI
oauth2.public-realm-url=http://localhost:19103/realms/pax
oauth2.private-realm-url=http://localhost:19103/realms/pax
oauth2.health-url=http://kc:8080/health/ready
oauth2.requires-secure-metadata=false
oauth2.issuers[0]=http://localhost:19103/realms/pax
oauth2.audiences[0]=Admin
oauth2.audiences[1]=SwaggerUI
oauth2.audiences[2]=Android
springdoc.swagger-ui.oauth.client-id=${oauth2.client-id}
springdoc.swagger-ui.oauth.realm=${oauth2.realm}
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
# Swagger UI and OpenAPI docs. A client may open them from these CIDR ranges,
# or with a token that has ROLE_ADMIN. A bare address matches that one host.
# 172.16.0.0/12 covers the Docker networks used by compose. Replace it with the
# real client range when this API is reachable from elsewhere.
swagger.access.allowed-ip-ranges[0]=127.0.0.1
# Full request and response log: headers, bodies, and multipart file metadata.
# Leave false except while troubleshooting; the log includes credentials and payloads.
http-log.enabled=true
spring.datasource.url=jdbc:postgresql://localhost:19111/pax
spring.datasource.username=pax_dml_api
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.r2dbc.url=r2dbc:postgresql://localhost:19111/pax
spring.r2dbc.username=pax_dml_api
spring.r2dbc.password=password
# R2DBC suppresses the JDBC DataSource, so Flyway only starts when its own URL is set.
# Flyway uses pax_ddl_fw. Production must set PAX_PG_PAX_DDL_FW_PWD (or SPRING_FLYWAY_PASSWORD).
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://localhost:19111/pax
spring.flyway.user=pax_ddl_fw
spring.flyway.password=password
spring.flyway.locations=classpath:db/migration

# SchemaCheck applies these settings. Hibernate auto-configuration does not start,
# because the R2DBC ConnectionFactory suppresses the JDBC DataSource it requires.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.jakarta.persistence.schema-generation.database.action=validate
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=update
spring.jpa.properties.hibernate.type.prefer_native_enum_types=false
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP