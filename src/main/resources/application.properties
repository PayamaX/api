spring.application.name=PayamaX
# Honor X-Forwarded-* from the reverse proxy so generated URLs, including Swagger, use https.
server.forward-headers-strategy=framework
oauth2.realm=pax
oauth2.client-id=SwaggerUI
oauth2.public-realm-url=http://localhost:19103/realms/pax
oauth2.private-realm-url=http://localhost:19103/realms/pax
oauth2.health-url=http://kc:8080/health/ready
oauth2.requires-secure-metadata=false
oauth2.issuers[0]=http://localhost:19103/realms/pax
oauth2.audiences[0]=Admin
oauth2.audiences[1]=SwaggerUI
oauth2.audiences[2]=Android
springdoc.swagger-ui.oauth.client-id=${oauth2.client-id}
springdoc.swagger-ui.oauth.realm=${oauth2.realm}
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
# Swagger UI and OpenAPI docs. A client may open them from these CIDR ranges,
# or with a token that has ROLE_ADMIN. A bare address matches that one host.
# 172.16.0.0/12 covers the Docker networks used by compose. Replace it with the
# real client range when this API is reachable from elsewhere.
swagger.access.allowed-ip-ranges[0]=127.0.0.1
swagger.access.allowed-ip-ranges[1]=::1
swagger.access.allowed-ip-ranges[2]=172.16.0.0/12
# Full request and response log: headers, bodies, and multipart file metadata.
# Leave false except while troubleshooting; the log includes credentials and payloads.
http-log.enabled=true
spring.datasource.url=jdbc:postgresql://localhost:19101/pax
spring.datasource.username=pax_dml_api
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.r2dbc.url=r2dbc:postgresql://localhost:19101/pax
spring.r2dbc.username=pax_dml_api
spring.r2dbc.password=password
# R2DBC suppresses the JDBC DataSource, so Flyway only starts when its own URL is set.
# Flyway uses pax_ddl_fw. Production must set PAX_PG_PAX_DDL_FW_PWD (or SPRING_FLYWAY_PASSWORD).
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://localhost:19101/pax
spring.flyway.user=pax_ddl_fw
spring.flyway.password=password
spring.flyway.locations=classpath:db/migration