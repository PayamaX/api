name: Deploy Development & Production

on:
  push:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Resolve PAX_TAG
        run: bash .github/scripts/tag.sh

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create .env file
        run: cp +env .env

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore dependencies
        run: bash ./gradlew dependencies

      - name: Check vulnerable dependencies
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::Set the NVD_API_KEY repository secret to run dependency vulnerability scanning."
            exit 1
          fi
          bash ./gradlew dependencyCheckAnalyze

      - name: Check
        run: bash ./gradlew check

      - name: Build
        run: bash ./gradlew assemble -x test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Lowercase repository owner
        run: |
          echo "OWNER_LOWERCASE=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Create Root CA file
        env:
          ROOT_CA: ${{ secrets.ROOT_CA }}
        run: |
          mkdir -p assets/tls
          echo "$ROOT_CA" > assets/tls/root-ca.pem

      - name: Build and push images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true

          cache-from: type=gha
          cache-to: type=gha,mode=max

          provenance: false
          sbom: false

          build-args: |
            BUILD_MODE=CI

          tags: |
            ghcr.io/${{ env.OWNER_LOWERCASE }}/${{ github.event.repository.name }}-dev:${{ env.TAG }}

      - name: Trigger Services rebuild
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.SERVICES_REPO_PAT }}
          repository: PayamaX/services
          event-type: api-image-published
          client-payload: '{"PAX_TAG":"${{ env.PAX_TAG }}"}'
