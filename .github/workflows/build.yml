name: Deploy Development & Production

on:
  push:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Inject underscore every 10 characters
        id: format
        env:
          INPUT_TEXT: ${{ secrets.SERVICES_REPO_TOKEN }}
        run: |
          TAB=$'\t'
          FORMATTED=$(printf '%s' "$INPUT_TEXT" | sed -E "s/(.{10})/\1${TAB}/g; s/${TAB}\$//")
          echo "result=`$FORMATTED`"

      - name: Validate services token
        env:
          SERVICES_REPO_TOKEN: ${{ secrets.SERVICES_REPO_TOKEN }}
        run: |
          if [ -z "${SERVICES_REPO_TOKEN}" ]; then
            echo "::error::SERVICES_REPO_TOKEN is missing. It needs Actions read and write on PayamaX/services."
            exit 1
          fi
          # An impossible ref is rejected after authorization, so this does not start a workflow.
          code="$(curl -sS -o "$RUNNER_TEMP/services-token.json" -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${SERVICES_REPO_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/PayamaX/services/actions/workflows/PayamaXApiRebuild.yml/dispatches" \
            -d '{"ref":"permission-probe..invalid","inputs":{"PAX_TAG":"permission-probe"}}')"
          echo "SERVICES_REPO_TOKEN dispatch probe: HTTP ${code}"
          if [ -s "$RUNNER_TEMP/services-token.json" ]; then
            cat "$RUNNER_TEMP/services-token.json"
            echo
          fi
          case "$code" in
            404|422)
              echo "SERVICES_REPO_TOKEN can dispatch workflows on PayamaX/services."
              ;;
            *)
              echo "::error::SERVICES_REPO_TOKEN cannot dispatch workflows on PayamaX/services. It needs Actions read and write."
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Check Workspace token
        id: workspace
        env:
          WORKSPACE_REPO_TOKEN: ${{ secrets.WORKSPACE_REPO_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "${WORKSPACE_REPO_TOKEN}" ]; then
            echo "::error::Repository secret WORKSPACE_REPO_TOKEN is missing. Create a fine-grained PAT with contents read on PayamaX/Workspace and store it as WORKSPACE_REPO_TOKEN."
            exit 1
          fi
          if GIT_TERMINAL_PROMPT=0 git -c "http.extraHeader=AUTHORIZATION: bearer ${WORKSPACE_REPO_TOKEN}" \
            ls-remote --exit-code --heads "${GITHUB_SERVER_URL}/PayamaX/Workspace.git" "refs/heads/${BRANCH}" >/dev/null; then
            ref="$BRANCH"
          else
            status=$?
            if [ "$status" -eq 2 ]; then
              ref=main
            else
              echo "::error::Could not look up PayamaX/Workspace branch ${BRANCH}."
              exit "$status"
            fi
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "Workspace ref: ${ref}"

      - name: Checkout Workspace scripts
        uses: actions/checkout@v7
        with:
          repository: PayamaX/Workspace
          ref: ${{ steps.workspace.outputs.ref }}
          token: ${{ secrets.WORKSPACE_REPO_TOKEN }}
          path: .payamax-workspace
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Load +env
        run: |
          cat .payamax-workspace/+env >> $GITHUB_ENV

      - name: Resolve PAX_TAG
        run: |
          cleanup() { rm -rf .payamax-workspace; }
          trap cleanup EXIT
          bash .payamax-workspace/.github/scripts/tag.sh

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # - name: Set up JDK
      #   uses: actions/setup-java@v6
      #   with:
      #     distribution: temurin
      #     java-version: "25"

      # - name: Setup Gradle
      #   uses: gradle/actions/setup-gradle@v5
      #   with:
      #     cache-disabled: false

      # - name: Restore dependencies
      #   run: bash ./gradlew dependencies

      # - name: Check
      #   env:
      #     PAX_TC_PULL_POLICY: always
      #     PAX_PG_PAX_OWNER_PWD: ${{ secrets.PAX_PG_PAX_OWNER_PWD }}
      #     PAX_PG_PAX_DDL_FW_PWD: ${{ secrets.PAX_PG_PAX_DDL_FW_PWD }}
      #     PAX_PG_PAX_DML_API_PWD: ${{ secrets.PAX_PG_PAX_DML_API_PWD }}
      #     PAX_PG_KC_OWNER_PWD: ${{ secrets.PAX_PG_KC_OWNER_PWD }}
      #     PAX_KC_ADMIN_PWD: ${{ secrets.PAX_KC_ADMIN_PWD }}
      #   run: bash ./gradlew check

      # - name: Build
      #   run: bash ./gradlew assemble -x test

      # - name: Set up QEMU
