      # - name: Create Root CA file
      #   env:
      #     ROOT_CA: ${{ secrets.ROOT_CA }}
      #   run: |
      #     mkdir -p assets/tls
      #     echo "$ROOT_CA" > assets/tls/root-ca.pem

      # - name: Prepare Maven local build context
      #   run: mkdir -p .m2-empty/repository

      # - name: Build and push images
      #   uses: docker/build-push-action@v7
      #   with:
      #     context: .
      #     file: ./Dockerfile
      #     build-contexts: mavenlocal=${{ github.workspace }}/.m2-empty
      #     platforms: linux/amd64,linux/arm64
      #     push: true

      #     cache-from: type=gha
      #     cache-to: type=gha,mode=max

      #     provenance: false
      #     sbom: false

      #     build-args: |
      #       BUILD_MODE=CI
      #       PAX_JDK_VER=${{ env.PAX_JDK_VER }}
      #       PAX_JRE_VER=${{ env.PAX_JRE_VER }}
      #       PAX_GRD_VER=${{ env.PAX_GRD_VER }}
      #       PAX_ADMIN_URL=${{ vars.PAX_ADMIN_URL }}

      #     tags: |
      #       ghcr.io/${{ env.OWNER_LOWERCASE }}/${{ github.event.repository.name }}-dev:${{ env.PAX_TAG }}

      - name: Trigger Services rebuild
        env:
          SERVICES_REPO_TOKEN: ${{ secrets.SERVICES_REPO_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          PAX_TAG: ${{ env.PAX_TAG }}
        run: |
          if [ -z "${SERVICES_REPO_TOKEN}" ]; then
            echo "::error::Repository secret SERVICES_REPO_TOKEN is missing. It needs Actions read and write on PayamaX/services."
            exit 1
          fi
          dispatch() {
            local target="$1"
            local body code
            body="$(jq -n --arg ref "$target" --arg tag "$PAX_TAG" '{ref:$ref, inputs:{PAX_TAG:$tag}}')"
            code="$(curl -sS -o "$RUNNER_TEMP/services-dispatch.json" -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${SERVICES_REPO_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/PayamaX/services/actions/workflows/PayamaXApiRebuild.yml/dispatches" \
              -d "$body")"
            printf '%s' "$code" > "$RUNNER_TEMP/services-dispatch.code"
            echo "Dispatch ${target}: HTTP ${code}"
            if [ -s "$RUNNER_TEMP/services-dispatch.json" ]; then
              cat "$RUNNER_TEMP/services-dispatch.json"
              echo
            fi
            [ "$code" = "204" ]
          }
          if dispatch "$BRANCH"; then
            echo "Started PayamaX Api Rebuild on ${BRANCH}."
            exit 0
          fi
          code="$(cat "$RUNNER_TEMP/services-dispatch.code")"
          if [ "$BRANCH" != "main" ] && { [ "$code" = "404" ] || [ "$code" = "422" ]; } && dispatch main; then
            echo "PayamaX/services branch ${BRANCH} cannot run PayamaX Api Rebuild. Started it on main."
            exit 0
          fi
          echo "::error::Could not start PayamaX Api Rebuild. SERVICES_REPO_TOKEN needs Actions read and write on PayamaX/services."
          exit 1
